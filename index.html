const { useState, useEffect, useCallback, useRef, memo } = React;

/* ---------------------------------------------------------------
   FIREBASE CLOUD FUNCTION URL
   Project: jarvis-global-gps-tracker
   After `firebase deploy`, this URL is live and receives the
   emergency payload (email + picture base64 + WhatsApp numbers).
   --------------------------------------------------------------- */
const FIREBASE_SEND_URL = 'https://us-central1-jarvis-global-gps-tracker.cloudfunctions.net/sendEmergencyEmail';

/* ---------------------------------------------------------------
   STORAGE KEYS
--------------------------------------------------------------- */
const SK = {
  email: 'jarvis_em_email',
  wa1: 'jarvis_em_wa1',
  wa2: 'jarvis_em_wa2',

/* ---------------------------------------------------------------
   IndexedDB helper (stores image blobs safely, no quota crash)
--------------------------------------------------------------- */
const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('jarvis-emergency', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('profile')) db.createObjectStore('profile');
      };
      req.onsuccess = () => { this.db = req.result; resolve(this.db); };
      req.onerror = () => reject(req.error);
    });
  },
  async set(key, val) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('profile', 'readwrite');
      tx.objectStore('profile').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('profile', 'readonly');
      const r = tx.objectStore('profile').get(key);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  },
  async del(key) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('profile', 'readwrite');
      tx.objectStore('profile').delete(key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
};

/* ---------------------------------------------------------------
   Crash-safe Icon (Lucide rendered in its own DOM slot)
--------------------------------------------------------------- */
const Icon = memo(function Icon({ name, className }) {
  const slotRef = useRef(null);
  useEffect(() => {
    const slot = slotRef.current;
    if (!slot || !window.lucide) return;
    if (slot.dataset.rendered === 'true') return;
    try {
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      if (className) i.setAttribute('class', className);
      slot.appendChild(i);
      window.lucide.createIcons({ attrs: { class: className || '' }, nameAttr: 'data-lucide' });
      slot.dataset.rendered = 'true';
    } catch (e) {
      console.warn('icon fail', name, e);
    }
  }, [name, className]);
  return <span ref={slotRef} className="lucide-slot"></span>;
});

/* ---------------------------------------------------------------
   Image downscale + conversion helpers
--------------------------------------------------------------- */
function downscaleImage(file, max = 512) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
    img.src = url;
  });
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

/* ---------------------------------------------------------------
   Geocoding helpers (OpenStreetMap Nominatim)
--------------------------------------------------------------- */
async function geocodeAddress(address) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('Geocoding failed');
  const data = await res.json();
  if (!data.length) throw new Error('Address not found');
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), displayName: data[0].display_name };
}
async function reverseGeocode(lat, lng) {
  const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, { headers: { Accept: 'application/json' } });
  if (!res.ok) return null;
  const d = await res.json();
  return d.display_name || null;
}

/* ---------------------------------------------------------------
   Firebase sender (calls our Cloud Function)
--------------------------------------------------------------- */
async function sendEmergencyViaFirebase(payload) {
  const res = await fetch(FIREBASE_SEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const msg = await res.text().catch(() => '');
    throw new Error(`Firebase send failed (${res.status}): ${msg.slice(0, 200)}`);
  }
  return res.json();
}

/* ---------------------------------------------------------------
   MAIN APP
--------------------------------------------------------------- */
function App() {

    deviceName: 'Browser GPS Tracker', address: null, source: 'default'

  const [searchQuery, setSearchQuery] = useState('');

  const [wa1, setWa1] = useState('');
  const [wa2, setWa2] = useState('');

  const [picName, setPicName] = useState('');
  const [status, setStatus] = useState('');
  const [statusType, setStatusType] = useState('');
  const [savedAt, setSavedAt] = useState(null);
  const [saved, setSaved] = useState(false);
  const [sending, setSending] = useState(false);
  const fileRef = useRef(null);
  const previewUrlRef = useRef(null);

  /* Load saved profile on mount */
  useEffect(() => {
    (async () => {
      try {
        setEmail(localStorage.getItem(SK.email) || '');
        setWa1(localStorage.getItem(SK.wa1) || '');
        setWa2(localStorage.getItem(SK.wa2) || '');
        setPicName(localStorage.getItem(SK.picName) || '');
        const at = localStorage.getItem(SK.savedAt);
        if (at) {
          setSavedAt(at);
          setSaved(!!(localStorage.getItem(SK.email) && localStorage.getItem(SK.wa1) && at));
        }
        const blob = await idb.get(SK.picBlob).catch(() => null);
        if (blob) {
          setPicBlob(blob);
          const u = URL.createObjectURL(blob);
          previewUrlRef.current = u;
          setPicPreviewUrl(u);
        }
      } catch (e) { console.warn('load profile fail', e); }
    })();
    return () => { if (previewUrlRef.current) URL.revokeObjectURL(previewUrlRef.current); };
  }, []);

  /* GPS */
  const requestGPS = useCallback(() => {
    if (!navigator.geolocation) { setGpsError('Geolocation unsupported.'); return; }
    setIsLoading(true); setGpsError(null);
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const address = await reverseGeocode(latitude, longitude).catch(() => null);
        setDeviceData({
          latitude, longitude, accuracy: Math.round(accuracy), battery: 100,
          signalStrength: 'GPS Satellite Lock',
          lastUpdated: new Date().toLocaleTimeString(),
          status: 'ONLINE', deviceName: 'Browser GPS Tracker',
          address, source: 'gps'
        });
        setIsLoading(false); setGpsActive(true);
      },
      (err) => {
        setGpsError(err.code === 1 ? 'Permission denied. Enable location.' : 'GPS unavailable.');
        setIsLoading(false);
        setDeviceData(p => ({ ...p, status: 'OFFLINE', signalStrength: 'No GPS' }));
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }, []);
  useEffect(() => { requestGPS(); }, [requestGPS]);

  const handleAddressSearch = async (e) => {
    e.preventDefault();
    if (!searchQuery.trim()) return;
    setIsSearching(true); setSearchError(null);
    try {
      const r = await geocodeAddress(searchQuery.trim());
      setDeviceData({
        latitude: r.lat, longitude: r.lng, accuracy: null, battery: 100,
        signalStrength: 'Address Lookup', lastUpdated: new Date().toLocaleTimeString(),
        status: 'LOCATED', deviceName: r.displayName.split(',')[0] || 'Searched Address',
        address: r.displayName, source: 'search'

      setGpsActive(false);
    } catch { setSearchError('Address not found.'); }
    finally { setIsSearching(false); }
  };

  /* File handling — the blank-screen fix */
  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      setStatus('Please pick an image file.'); setStatusType('error'); return;
    }
    try {
      const small = await downscaleImage(file, 512);
      if (previewUrlRef.current) URL.revokeObjectURL(previewUrlRef.current);
      const u = URL.createObjectURL(small);
      previewUrlRef.current = u;
      setPicBlob(small);
      setPicPreviewUrl(u);
      setPicName(file.name);
      setStatus(''); setStatusType('');
    } catch (err) {
      console.warn(err);
      setStatus('Could not process that image. Try another.'); setStatusType('error');
    }
  };

  const clearPic = async () => {
    if (previewUrlRef.current) { URL.revokeObjectURL(previewUrlRef.current); previewUrlRef.current = null; }
    setPicPreviewUrl(null); setPicBlob(null); setPicName('');
    if (fileRef.current) fileRef.current.value = '';
    await idb.del(SK.picBlob).catch(() => {});
  };

  /* Save profile */
  const saveProfile = async () => {
    const e = email.trim(), p = wa1.trim();
    if (!e || !p) { setStatus('❌ Email and primary WhatsApp are required.'); setStatusType('error'); return; }
    if (!e.includes('@') || !e.includes('.')) { setStatus('❌ Invalid email.'); setStatusType('error'); return; }
    try {
      localStorage.setItem(SK.email, e);
      localStorage.setItem(SK.wa1, p);
      localStorage.setItem(SK.wa2, wa2.trim());
      if (picBlob) {
        await idb.set(SK.picBlob, picBlob);
        localStorage.setItem(SK.picName, picName);
      } else {
        await idb.del(SK.picBlob).catch(() => {});
        localStorage.removeItem(SK.picName);
      }
      const now = new Date().toLocaleString();
      localStorage.setItem(SK.savedAt, now);
      setSavedAt(now); setSaved(true);
      setStatus('✅ Emergency profile saved. It will auto-load next time.'); setStatusType('success');
    } catch (err) {
      console.error(err);
      setStatus('❌ Could not save. Your browser may be blocking storage.'); setStatusType('error');
    }
  };

  /* Send emergency (Firebase primary + mailto/wa.me backup) */
  const sendEmergency = async () => {
    if (!saved) { setStatus('⚠️ Save the profile first.'); setStatusType('error'); return; }
    const e = email.trim(), p = wa1.trim();
    if (!e || !p) { setStatus('❌ Email and primary WhatsApp required.'); setStatusType('error'); return; }
    if (deviceData.latitude == null) { setStatus('❌ No location yet.'); setStatusType('error'); return; }

    const lat = deviceData.latitude, lng = deviceData.longitude;
    const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;
    const locationText = `Latitude: ${lat.toFixed(6)}, Longitude: ${lng.toFixed(6)}`;
    const addressText = deviceData.address ? `\nAddress: ${deviceData.address}` : '';
    const pictureNote = picBlob ? `\n📸 Profile picture attached.` : `\n📸 No profile picture.`;

    const text =
      `🚨 EMERGENCY! I need help.\n\n` +
      `My exact location:\n${locationText}${addressText}\n\n` +
      `Google Maps: ${mapLink}\n${pictureNote}\n\n` +
      `Sent from J.A.R.V.I.S. GPS Tracker.`;

    setSending(true);
    setStatus('📡 Sending via Firebase…'); setStatusType('info');

    let firebaseOk = false;
    try {
      let pictureBase64 = null;
      if (picBlob) pictureBase64 = await blobToDataURL(picBlob);
      await sendEmergencyViaFirebase({
        to: e,
        subject: '🚨 EMERGENCY: I need help!',
        text,
        pictureBase64,
        wa1: p,
        wa2: wa2.trim(),
        lat, lng,
      });
      firebaseOk = true;
      setStatus('✅ Emergency email sent via Firebase. Opening WhatsApp chats as backup.');
      setStatusType('success');
    } catch (err) {
      console.warn('Firebase send failed:', err);
      setStatus('⚠️ Firebase send failed. Opening mail + WhatsApp as fallback.');
      setStatusType('error');
    } finally {
      setSending(false);
    }

    /* Fallback / backup links */
    const mailto = `mailto:${encodeURIComponent(e)}?subject=${encodeURIComponent('🚨 EMERGENCY: I need help!')}&body=${encodeURIComponent(text)}`;
    try { window.open(mailto, '_blank'); } catch (_) { window.location.href = mailto; }

    const clean = p.replace(/[^0-9]/g, '');
    if (clean.length >= 10) {
      const waMsg = `🚨 EMERGENCY! I need help.\n\nMy exact location:\n${locationText}${addressText}\n\nMap: ${mapLink}\n${pictureNote}`;
      setTimeout(() => window.open(`https://wa.me/${clean}?text=${encodeURIComponent(waMsg)}`, '_blank'), 800);
    }
    const clean2 = wa2.trim().replace(/[^0-9]/g, '');
    if (clean2.length >= 10) {
      const waMsg = `🚨 EMERGENCY! I need help (secondary).\n\n${locationText}${addressText}\n\nMap: ${mapLink}\n${pictureNote}`;
      setTimeout(() => window.open(`https://wa.me/${clean2}?text=${encodeURIComponent(waMsg)}`, '_blank'), 1500);
    }

    if (!firebaseOk && clean.length < 10 && clean2.length < 10) {
      setStatus('❌ No valid WhatsApp number and Firebase failed. Email only.');
      setStatusType('error');
    }
  };

  const bbox = 0.01;
  const mapSrc = `https://www.openstreetmap.org/export/embed.html?bbox=${deviceData.longitude - bbox}%2C${deviceData.latitude - bbox}%2C${deviceData.longitude + bbox}%2C${deviceData.latitude + bbox}&layer=mapnik&marker=${deviceData.latitude}%2C${deviceData.longitude}`;

          <a href={googleMapsLink} target="_blank" rel="noopener noreferrer"

          <Icon name="alert-triangle" className="w-4 h-4 mt-0.5 flex-shrink-0" />
          <span>{gpsError || searchError}</span>

            <div className="grid grid-cols-2 gap-3">

              {deviceData.accuracy && <p className="text-xs text-slate-500">Accuracy: ±{deviceData.accuracy} m</p>}
            </div>
            <div className="flex justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-800">
              <span>Last Update:</span><span className="text-slate-300 font-mono">{deviceData.lastUpdated}</span>
            </div>
          </div>
          <div className="mt-4 pt-4 border-t border-slate-800 text-xs text-slate-500 space-y-1">
            <p className="font-semibold text-cyan-400">Built by Gesner Deslandes</p>
            <p>Software Developer</p>
            <p>📞 (509) 47385663</p>
            <p>✉️ deslandes78@gmail.com</p>
            <a href="https://deslandes1.github.io/G-COMMUNICATION-2026/" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:text-cyan-300 inline-flex items-center gap-1 mt-1">
              <Icon name="link" className="w-3 h-3" /> G Jarvis Communication Portal
            </a>
          </div>
        </div>

        <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[500px] md:h-[600px] shadow-xl">
          <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
            <span className="text-xs font-semibold text-slate-300 tracking-wider uppercase flex items-center gap-2">
              <Icon name="radio" className="w-4 h-4 text-cyan-400 animate-pulse" /> Real-time Geolocation
            </span>
            <span className="text-xs text-slate-500">
              {deviceData.source === 'gps' ? 'Live GPS' : deviceData.source === 'search' ? 'Address Match' : 'Default View'}
            </span>
          </div>
          <div className="flex-1 relative bg-slate-950">
            <iframe title="GPS Tracker Map" className="w-full h-full dark-map border-0" src={mapSrc} loading="lazy" />
            <div className="absolute top-4 left-4 bg-slate-900/90 backdrop-blur border border-slate-700 p-3 rounded-lg shadow-xl text-xs space-y-1 max-w-[260px]">
              <div className="font-bold text-cyan-400 flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${deviceData.source === 'gps' ? 'bg-emerald-400 animate-ping' : 'bg-cyan-400'}`} />
                {deviceData.source === 'gps' ? 'Live GPS Active' : deviceData.source === 'search' ? 'Address Located' : 'Default View'}
              </div>
              <div className="text-slate-300 text-[11px] leading-snug">{deviceData.deviceName}</div>
            </div>
            {!gpsActive && deviceData.source !== 'search' && (
              <div className="absolute inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-xl p-6 max-w-sm text-center">
                  <Icon name="map-pin" className="w-12 h-12 text-cyan-400 mx-auto mb-3" />
                  <h3 className="text-base font-bold text-slate-100 mb-2">Enable GPS to Locate You</h3>
                  <p className="text-xs text-slate-400 mb-4">
                    Allow location access to see your exact position, or search by address above.
                  </p>
                  <button onClick={requestGPS} disabled={isLoading}
                    className="w-full bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-2">
                    <Icon name={isLoading ? 'loader' : 'crosshair'} className={`w-4 h-4 ${isLoading ? 'animate-spin' : ''}`} />
                    {isLoading ? 'Requesting…' : 'Enable GPS'}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      <footer className="mt-8 border-t border-slate-800 pt-4 flex flex-col md:flex-row justify-between items-center gap-3 text-xs text-slate-500">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 justify-center md:justify-start">
          <span className="font-semibold text-cyan-400">Gesner Deslandes</span><span>·</span>
          <span>Software Developer</span><span>·</span>
          <span>📞 (509) 47385663</span><span>·</span>
          <span>✉️ deslandes78@gmail.com</span>
        </div>
        <div className="flex gap-3">
          <a href="https://deslandes1.github.io/G-COMMUNICATION-2026/" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:text-cyan-300">G Jarvis Portal</a>
          <a href="https://deslandes1.github.io/GlobalInternet.py-Website-Static-Site-Conversion-2026/" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:text-cyan-300">Website</a>
        </div>
      </footer>

      {showEmergencyPanel && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-red-700/50 rounded-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto shadow-2xl">
            <div className="bg-gradient-to-r from-red-700 to-red-900 px-5 py-4 rounded-t-2xl flex justify-between items-center sticky top-0 z-10">
              <h2 className="text-white font-bold text-lg flex items-center gap-2">
                <Icon name="alert-triangle" className="w-5 h-5" /> Locate Me For Help
              </h2>
              <button onClick={() => setShowEmergencyPanel(false)}
                className="text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full p-1.5 transition-colors" aria-label="Close">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <div className="p-5 space-y-5">
              {saved && (
                <div className="bg-emerald-900/30 border border-emerald-700/50 rounded-lg p-3 text-xs text-emerald-300 flex items-start gap-2">
                  <Icon name="check-circle" className="w-4 h-4 mt-0.5 flex-shrink-0" />
                  <span>Emergency profile saved{savedAt ? ` on ${savedAt}` : ''}. Edit and re-save anytime.</span>
                </div>
              )}

              <p className="text-xs text-slate-400 leading-relaxed">
                In an emergency, tap the red button. Your exact GPS position will be sent
                by <span className="text-cyan-300 font-semibold">email</span> (via Firebase, with picture attached)
                and via <span className="text-emerald-300 font-semibold">WhatsApp</span>.
              </p>

              <div>
                <label className="text-xs font-semibold text-slate-300 uppercase tracking-wide flex items-center gap-1.5 mb-2">
                  <Icon name="image" className="w-3.5 h-3.5 text-cyan-400" /> Profile Picture
                </label>
                <div className="flex items-center gap-3">
                  <div className="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center overflow-hidden flex-shrink-0">
                    {picPreviewUrl
                      ? <img src={picPreviewUrl} alt="Profile preview" className="w-full h-full object-cover" />
                      : <Icon name="user" className="w-7 h-7 text-slate-600" />}
                  </div>
                  <div className="flex-1 space-y-2">
                    <input ref={fileRef} type="file" accept="image/*" onChange={handleFile}
                      className="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 file:cursor-pointer cursor-pointer bg-slate-950 border border-slate-700 rounded-lg" />
                    {picName && (
                      <div className="flex items-center justify-between text-xs">
                        <span className="text-slate-400 truncate">{picName}</span>
                        <button onClick={clearPic} className="text-red-400 hover:text-red-300 font-semibold ml-2 flex-shrink-0">Remove</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 uppercase tracking-wide flex items-center gap-1.5 mb-2">
                  <Icon name="mail" className="w-3.5 h-3.5 text-cyan-400" /> Emergency Email
                  <span className="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full normal-case">required</span>
                </label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                  placeholder="trusted-contact@example.com"
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-red-500 transition-colors" />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 uppercase tracking-wide flex items-center gap-1.5 mb-2">
                  <Icon name="message-circle" className="w-3.5 h-3.5 text-emerald-400" /> WhatsApp (Primary)
                  <span className="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full normal-case">required</span>
                </label>
                <input type="tel" value={wa1} onChange={e => setWa1(e.target.value)}
                  placeholder="+509 4738 5663"
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors" />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 uppercase tracking-wide flex items-center gap-1.5 mb-2">
                  <Icon name="message-circle" className="w-3.5 h-3.5 text-slate-500" /> WhatsApp (Secondary)
                  <span className="text-[10px] bg-slate-700/50 text-slate-400 px-2 py-0.5 rounded-full normal-case">optional</span>
                </label>
                <input type="tel" value={wa2} onChange={e => setWa2(e.target.value)}
                  placeholder="+1 234 567 8900"
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-slate-500 transition-colors" />
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-lg p-3">
                <p className="text-[10px] text-slate-500 uppercase tracking-wide mb-1">Location to send</p>
                <p className="font-mono text-xs text-cyan-300">
                  Lat: {deviceData.latitude.toFixed(6)} · Lng: {deviceData.longitude.toFixed(6)}
                </p>
                {deviceData.address && <p className="text-[11px] text-slate-400 mt-1 leading-snug">{deviceData.address}</p>}
              </div>

              {status && (
                <div className={`rounded-lg p-3 text-xs flex items-start gap-2 ${
                  statusType === 'success' ? 'bg-emerald-900/30 border border-emerald-700/50 text-emerald-300'
                  : statusType === 'error' ? 'bg-red-900/30 border border-red-700/50 text-red-300'
                  : 'bg-slate-800/50 border border-slate-700 text-slate-300'}`}>
                  <Icon name={statusType === 'success' ? 'check-circle' : 'alert-triangle'} className="w-4 h-4 mt-0.5 flex-shrink-0" />
                  <span>{status}</span>
                </div>
              )}

              <button onClick={saveProfile}
                className="w-full bg-slate-800 hover:bg-slate-700 border border-cyan-600/50 text-cyan-300 font-semibold text-sm py-3 rounded-xl flex items-center justify-center gap-2 transition-colors">
                <Icon name="save" className="w-4 h-4" />
                {saved ? 'Update Saved Emergency Profile' : 'Save Emergency Profile'}
              </button>

              <button onClick={sendEmergency} disabled={!saved || sending}
                className={`w-full font-bold text-base py-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg ${
                  saved && !sending
                    ? 'bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 emergency-pulse text-white shadow-red-900/50'
                    : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}`}>
                <Icon name={sending ? 'loader' : 'alert-triangle'} className={`w-6 h-6 ${sending ? 'animate-spin' : ''}`} />
                {sending ? 'SENDING…' : saved ? 'SEND EMERGENCY LOCATION NOW' : 'SAVE PROFILE FIRST TO ENABLE'}
              </button>

              <p className="text-[10px] text-slate-500 text-center leading-relaxed">
                Emergency email is delivered automatically via Firebase Cloud Function (with picture attached).
                WhatsApp links open your WhatsApp to send the message.
              </p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
